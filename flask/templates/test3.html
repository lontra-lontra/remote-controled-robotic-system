<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>PID Controller Overview</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chart.js/3.7.1/chart.min.js"></script>
    <style>
        :root {
            --navy-blue: #1A3D5E;
            --light-blue: #4A90E2;
            --background-blue: #F0F4F8;
        }
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: var(--background-blue);
        }
        .header {
            background-color: var(--navy-blue);
            color: white;
            display: flex;
            align-items: center;
            padding: 10px 20px;
        }
        .logo img {
            width: 100px;
            height: auto;
            margin-right: 15px;
        }
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: white;
        }
        .button-container {
            margin-bottom: 20px;
        }
        .view-container {
            width: 100%;
            max-width: 800px;
            display: none;
        }
        .active {
            display: block;
        }
        .camera-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 1300px;
            margin: auto;
        }
        iframe {
            width: 100%;
            height: 300px;
            border: 1px solid #ccc;
        }
        .footer {
            background-color: var(--navy-blue);
            color: white;
            display: flex;
            justify-content: space-around;
            padding: 10px;
        }
        button {
            background-color: var(--light-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }
        button:hover {
            background-color: var(--navy-blue);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="http://127.0.0.1:1981/static/minesparisLOGO.png" alt="LOGO">
        </div>
        <h1>Project IDS: Remote Controled Robotic System</h1>
    </div>
    
    <div class="main-content">
        <div class="button-container">
            <button onclick="toggleView('content-view')">Rapport</button>
            <button onclick="toggleView('camera-view')">Données et camera</button>
        </div>
        
        <div id="content-view" class="view-container active">
            <h2>Contenu Défilable</h2>
            <p>Bienvenue tout le monde à notre projet sur le remote controlled robotic system.</p>
            <iframe src="PROJECTIDS.pdf" width="100%" height="600px"></iframe>
        </div>
        
        <div id="camera-view" class="view-container">
            <h3>Vue de la Caméra</h3>
            <div class="camera-grid">
                <iframe src="graph?query=values_camera" width="640" height="480"></iframe>
                <iframe src="graph?query=values_motor" width="640" height="480"></iframe>
                <iframe src="/graph?query=values" width="640" height="480"></iframe>
                <iframe src="/graph?query=values_speed_camera" width="640" height="480"></iframe>
                <iframe src="/graph?query=values_camera_filtered" width="640" height="480"></iframe>
                <iframe src="/graph?query=values_derivative_of_camera_filtered" width="640" height="480"></iframe>
                <iframe src="/camera_view" width="640" height="480"></iframe>
            </div>
        </div>
    </div>
    
    <div class="footer">
        <span>Solal Raymondjean</span>
        <span>Ian Ribeiro</span>
        <span>Davi Loucena</span>
        <span>Yanis Marmier</span>
        <span>Ana Corrales</span>
    </div>


    <button onclick="resetValues()">Reset</button>

    <script>
        async function resetValues() {
            try {
                const response = await fetch('/reset', {
                    method: 'POST'
                });

                if (response.ok) {
                    console.log('Timer and values reset successfully');
                } else {
                    console.error('Error resetting values:', response.statusText);
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
    </script>

    <h2>Ici le PID:</h2>
    <button onclick="sendMessage()">Send</button>
    <br>
    <label for="PInput">P: </label>
    <input type="range" id="PInput" min="0" max="400" step="1" oninput="document.getElementById('PValue').innerText = this.value; sendMessage();">
    <span id="PValue">0</span>
    <br>
    <label for="IInput">I: </label>
    <input type="range" id="IInput" min="0" max="400" step="1" oninput="document.getElementById('IValue').innerText = this.value; sendMessage();">
    <span id="IValue">0</span>
    <br>
    <label for="DInput">D: </label>
    <input type="range" id="DInput" min="0" max="400" step="1" oninput="document.getElementById('DValue').innerText = this.value; sendMessage();">
    <span id="DValue">0</span>
    <br>
    <label for="BiasDistance">Bias Distance: </label>
    <input type="range" id="BiasDistance" min="0" max="200" step="1" value="112" oninput="document.getElementById('BiasDistanceValue').innerText = this.value; sendMessage();">
    <span id="BiasDistanceValue">112</span>
    <br>
    <label for="BiasMotor">Bias Motor: </label>
    <input type="range" id="BiasMotor" min="0" max="200" step="1" value="82" oninput="document.getElementById('BiasMotorValue').innerText = this.value; sendMessage();">
    <span id="BiasMotorValue">82</span>
    <br>

    <script>
        async function sendMessage() {
            const PInput = document.getElementById("PInput").value;
            const IInput = document.getElementById("IInput").value;
            const DInput = document.getElementById("DInput").value;
            const BiasDistance = document.getElementById("BiasDistance").value;
            const BiasMotor = document.getElementById("BiasMotor").value;

            const jsonData = {
                "BlockID": "webpub 1",
                "Signal": [
                    { "DataType": "single", "Value": [PInput] },
                    { "DataType": "single", "Value": [IInput] },
                    { "DataType": "single", "Value": [DInput] },
                    { "DataType": "single", "Value": [BiasDistance] },
                    { "DataType": "single", "Value": [BiasMotor] }
                ]
            };

            try {
                const response = await fetch('/api/send-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(jsonData)
                });

                if (response.ok) {
                    console.log('Data sent successfully');
                } else {
                    console.error('Error sending data:', response.statusText);
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
    </script>


    <script>
        function toggleView(viewId) {
            document.querySelectorAll('.view-container').forEach(view => {
                view.classList.remove('active');
            });
            document.getElementById(viewId).classList.add('active');
        }
    </script>
</body>
</html>
