<body>
    <img src="static/minesparisLOGO.png" alt="LOGO" width="250">
    <h2>Inteligent and Digital systems</h2>
    <p>Second year Engineering Student</p>
    <div class="underline"></div>
    <h1>Remote Controled Robotic System</h1>
    <div class="underline"></div>  
    
    <div class="details">
        <div class="left">
            <p><italic>Elaborated by:</italic></p>
            <p>Raymondjean Solal  </p>
            <p>Davi</p>
            <p>Ribeiro Ian</p>
            <p>Yanis</p>
            <p>Corrales Ana</p>
        </div>
        <div class="right">
            <p>Supervised by:</p>
            <p>Prof. Danielle</p>
        </div>
    </div>
    <p>Academic year: 2024/2025 </p>
    
    <h2>Ici le PID:</h2>
    <button onclick="sendMessage()">Send</button>
    <br>
    <label for="PInput">P: </label>
    <input type="range" id="PInput" min="0" max="100" step="1">
    <br>
    <label for="IInput">I: </label>
    <input type="range" id="IInput" min="0" max="100" step="1">
    <br>
    <label for="DInput">D: </label>
    <input type="range" id="DInput" min="0" max="100" step="1">
    <br>
    <label for="BiasDistance">Bias Distance: </label>
    <input type="range" id="BiasDistance" min="0" max="100" step="1">
    <br>
    <label for="BiasMotor">Bias Motor: </label>
    <input type="range" id="BiasMotor" min="0" max="100" step="1">
    <br>

    <script>
        async function sendMessage() {
            const PInput = document.getElementById("PInput").value;
            const IInput = document.getElementById("IInput").value;
            const DInput = document.getElementById("DInput").value;
            const BiasDistance = document.getElementById("BiasDistance").value;
            const BiasMotor = document.getElementById("BiasMotor").value;

            const jsonData = {
                "BlockID": "webpub 1",
                "Signal": [
                    { "DataType": "single", "Value": [PInput] },
                    { "DataType": "single", "Value": [IInput] },
                    { "DataType": "single", "Value": [DInput] },
                    { "DataType": "single", "Value": [BiasDistance] },
                    { "DataType": "single", "Value": [BiasMotor] }
                ]
            };

            try {
                const response = await fetch('/api/send-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(jsonData)
                });

                if (response.ok) {
                    console.log('Data sent successfully');
                } else {
                    console.error('Error sending data:', response.statusText);
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
    </script>
