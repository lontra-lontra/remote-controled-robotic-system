<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Values Graph</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <canvas id="cameraChart"></canvas>
    <script>
        const ctx = document.getElementById('cameraChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [
                    {
                        label: 'Values Camera',
                        borderColor: 'blue',
                        data: [],
                        parsing: false,
                        xAxisID: 'x1'
                    },
                    {
                        label: 'Values Camera 2',
                        borderColor: 'red',
                        data: [],
                        parsing: false,
                        xAxisID: 'x2'
                    }
                ]
            },
            options: {
                scales: {
                    x1: {
                        type: 'time',
                        position: 'bottom'
                    },
                    x2: {
                        type: 'time',
                        position: 'top'
                    },
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        async function fetchData() {
            try {
                const response1 = await fetch('/values_camera');
                const data1 = await response1.json();
                const response2 = await fetch('/values_camera_2');
                const data2 = await response2.json();

                chart.data.datasets[0].data = data1.map(d => ({ x: new Date(d[1]), y: d[0] }));
                chart.data.datasets[1].data = data2.map(d => ({ x: new Date(d[1]), y: d[0] }));
                chart.update();
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }
        
        setInterval(fetchData, 500);
        fetchData();
    </script>
</body>
</html>
