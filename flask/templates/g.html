<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <canvas id="realtimeChart" width="640" height="480"></canvas>
    <script>
        let chart; // Declare the chart variable globally

        function initializeChart() {
            const ctx = document.getElementById('realtimeChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [], // Initialize empty labels
                    datasets: [
                        {
                            label: 'Sensor Data',
                            data: [],
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 1,
                            fill: false
                        },
                        {
                            label: 'Camera Data',
                            data: [],
                            borderColor: 'rgba(255, 99, 132, 1)',
                            borderWidth: 1,
                            fill: false
                        }
                    ]
                },
                options: {
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'second'
                            }
                        },
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function fetchAndUpdateChart() {
            Promise.all([
                fetch('/values').then(response => response.json()),
                fetch('/values_camera').then(response => response.json())
            ])
            .then(([sensorData, cameraData]) => {
                console.log('Sensor Data:', sensorData);
                console.log('Camera Data:', cameraData);
                
                if (chart) {
                    // Merge and sort time values
                    const allTimes = [...sensorData.map(item => item[1]), ...cameraData.map(item => item[1])];
                    const uniqueSortedTimes = [...new Set(allTimes)].sort();
                    
                    chart.data.labels = uniqueSortedTimes;
                    
                    chart.data.datasets[0].data = uniqueSortedTimes.map(time => {
                        const entry = sensorData.find(item => item[1] === time);
                        return entry ? entry[0] : null;
                    });
                    
                    chart.data.datasets[1].data = uniqueSortedTimes.map(time => {
                        const entry = cameraData.find(item => item[1] === time);
                        return entry ? entry[0] : null;
                    });
                    
                    chart.update(); // Re-render the chart
                }
            })
            .catch(error => console.error('Error fetching values:', error));
        }

        // Initialize the chart and set up periodic updates
        initializeChart();
        setInterval(fetchAndUpdateChart, 200);
    </script>
</body>
</html>
