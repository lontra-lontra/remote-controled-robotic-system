<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min"></script>
    <title>Live Camera Values</title>
</head>
<body>
    <div id="chart"></div>
    <script>
        async function fetchData() {
            try {
                const res1 = await fetch('/values_camera');
                const data1 = await res1.json();
                const res2 = await fetch('/values_camera');
                const data2 = await res2.json();

                const trace1 = {
                    x: data1.map(d => new Date(d[1])),
                    y: data1.map(d => d[0]),
                    mode: 'lines',
                    name: 'Camera 1',
                    line: { color: 'blue' }
                };

                const trace2 = {
                    x: data2.map(d => new Date(d[1])),
                    y: data2.map(d => d[0]),
                    mode: 'lines',
                    name: 'Camera 2',
                    line: { color: 'red' }
                };

                Plotly.newPlot('chart', [trace1, trace2], { title: 'Live Camera Values' });
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }
        
        setInterval(fetchData, 500);
    </script>
</body>
</html>
