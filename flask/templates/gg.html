<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Scatter Plot</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <canvas id="realtimeChart" width="640" height="480"></canvas>
    <script>
        let chart;

        function initializeChart() {
            const query1 = new URLSearchParams(window.location.search).get('query1');
            const query2 = new URLSearchParams(window.location.search).get('query2');
            const ctx = document.getElementById('realtimeChart').getContext('2d');
            
            chart = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [{
                        label: `Real-Time Data: ${query1} vs ${query2}`,
                        data: [],
                        borderColor: 'rgba(75, 192, 192, 1)',
                        backgroundColor: 'rgba(75, 192, 192, 0.5)',
                        pointRadius: 5
                    }]
                },
                options: {
                    scales: {
                        x: {
                            type: 'linear',
                            title: { display: true, text: query1 },
                            beginAtZero: true
                        },
                        y: {
                            title: { display: true, text: query2 },
                            beginAtZero: true
                        }
                    },
                    animation: {
                        duration: 0
                    }
                }
            });
        }

        function fetchAndUpdateChart() {
            const query1 = new URLSearchParams(window.location.search).get('query1');
            const query2 = new URLSearchParams(window.location.search).get('query2');
            const url1 = `/${query1}`;
            const url2 = `/${query2}`;
            
            Promise.all([fetch(url1).then(res => res.json()), fetch(url2).then(res => res.json())])
                .then(([data1, data2]) => {
                    console.log(data1, data2);
                    if (chart) {
                        let combinedData = data1.map((item, index) => ({ x: item[0], y: data2[index][0] }));
                        chart.data.datasets[0].data = combinedData;
                        chart.update();
                    }
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        initializeChart();
        setInterval(fetchAndUpdateChart, 200);
    </script>
</body>
</html>
