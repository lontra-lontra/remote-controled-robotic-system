<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>PID Controller Overview</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chart.js/3.7.1/chart.min.js"></script>
    <script type="text/javascript" async
        src="https://polyfill.io/v3/polyfill.min.js?features=es6">
    </script>
    <script type="text/javascript" async
        src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js">
    </script>
    <style>
        :root {
            --navy-blue: #1A3D5E;
            --light-blue: #4A90E2;
            --background-blue: #F0F4F8;
        }
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: var(--background-blue);
        }
        .header {
            background-color: var(--navy-blue);
            color: white;
            display: flex;
            align-items: center;
            padding: 10px 20px;
        }
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: white;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .view-container {
            width: 100%;
            max-width: 800px;
            display: none;
        }
        .active {
            display: block;
        }
        .footer {
            background-color: var(--navy-blue);
            color: white;
            display: flex;
            justify-content: space-around;
            padding: 10px;
        }
        button {
            background-color: var(--light-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }
        button:hover {
            background-color: var(--navy-blue);
        }
        .professor-interface {
            display: none;
        }
        #password-container {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Project IDS: Remote Controled Robotic System</h1>
    </div>

    <div class="main-content">
        <div class="button-container">
            <button onclick="toggleView('content-view')">Rapport</button>
            <button onclick="toggleView('camera-view')">Données et camera</button>
            <button onclick="showPasswordInput()">Professeur</button>
        </div>

        <div id="password-container">
            <label for="password-input">Entrez le mot de passe :</label>
            <input type="password" id="password-input">
            <button onclick="checkPassword()">Valider</button>
        </div>

        <div id="message-container" style="display: none; text-align: center; margin-top: 20px;">
            <p>Accès autorisé ! Bienvenue dans la section Professeur.</p>
        </div>

        <div id="content-view" class="view-container active">
            <h2>Travaux pratiques d’Automatique en ligne</h2>
            <p>Bienvenue sur le projet d’Automatique en ligne !</p>
        </div>

        <div id="camera-view" class="view-container">
            <h3>Vue de la Caméra</h3>
        </div>

        <div id="professor-interface" class="view-container professor-interface">
            <h2>Section Professeur</h2>
            <label for="instruction">Instructions :</label>
            <textarea id="instruction" rows="4"></textarea>
            <br><br/>
            <label for="value">VAR ECARI :</label>
            <input type="number" id="value" min="0" max="100">
            <button onclick="submitProfessorData()">Envoyer</button>
        </div>
    </div>

    <div class="footer">
        <span>Solal Raymondjean</span>
        <span>Ian Ribeiro</span>
    </div>

    <script>
        function toggleView(viewId) {
            document.querySelectorAll('.view-container').forEach(view => {
                view.classList.remove('active');
            });
            document.getElementById(viewId).classList.add('active');
        }
        
        function showPasswordInput() {
            document.getElementById("password-container").style.display = "block";
        }

        function checkPassword() {
            let password = document.getElementById("password-input").value;
            if (password === "LONTRA") {
                document.getElementById("password-container").style.display = "none";
                document.getElementById("message-container").style.display = "block";
                document.getElementById("professor-interface").classList.add("active");
            } else {
                alert("Mot de passe incorrect.");
            }
        }
    </script>
</body>
</html>
