    <h2>Ici le PID:</h2>
   
    <label for="PInput">P: </label>
    <input type="text" id="PInput" placeholder="Enter value for P">
    <br>
    <label for="IInput">I: </label>
    <input type="text" id="IInput" placeholder="Enter value for I">
    <br>
    <label for="DInput">D: </label>
    <input type="text" id="DInput" placeholder="Enter value for D">
    <br>
    <button onclick="sendMessage()">Send</button>

    <script>
        // Replace with your WebSocket server URL
        const socketUrl = "ws://172.16.16.134:8080";
        let socket = new WebSocket(socketUrl);

        socket.onopen = function() {
            console.log("Connected to WebSocket server");
        };

        socket.onmessage = function(event) {
            console.log("Message from server: ", event.data);
        };

        socket.onerror = function(error) {
            console.error("WebSocket error: ", error);
        };

        socket.onclose = function() {
            console.log("WebSocket connection closed");
        };

        function sendMessage() {
            const PInput = document.getElementById("PInput");
            const IInput = document.getElementById("IInput");
            const DInput = document.getElementById("DInput");

            const PValue = PInput.value;
            const IValue = IInput.value;
            const DValue = DInput.value;

            const jsonData = {
                "BlockID": "webpub 1",
                "Signal": [
                    {
                        "DataType": "double",
                        "Value": [PValue]
                    },
                    {
                        "DataType": "double",
                        "Value": [IValue]
                    },
                    {
                        "DataType": "double",
                        "Value": [DValue]
                    }
                ]
            };

            console.log(jsonData);

            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(jsonData));
                console.log("JSON sent: ", jsonData);
            } else {
                console.error("WebSocket is not open");
            }
        }
    </script>
